trigger:
  - main
  - main-post

variables:
  appName: "AgentGaurd"
  azureSubscription: "azure-rm-sc"
  containerRegistry: "reciperegistry.azurecr.io"
  imageRepository: "agentgaurd"
  dockerRegistryServiceConnection: "recipeRegistry-connection"
  tag: "$(Build.BuildId)"

pool:
  vmImage: "ubuntu-latest"

steps:
  - task: Docker@2
    displayName: "Build Web Docker image"
    inputs:
      command: build
      repository: $(imageRepository)
      buildContext: $(Build.SourcesDirectory)
      dockerfile: '$(Build.SourcesDirectory)/web/Dockerfile'
      containerRegistry: $(dockerRegistryServiceConnection)
      tags: |
        $(tag)
        latest

  - task: Docker@2
    displayName: "Push Web Docker image to ACR"
    inputs:
      command: push
      repository: $(imageRepository)
      containerRegistry: $(dockerRegistryServiceConnection)
      tags: |
        $(tag)
        latest

  # Deploy Web to App Service
  - task: AzureWebAppContainer@1
    displayName: "Deploy Web container to App Service"
    inputs:
      azureSubscription: $(azureSubscription)
      appName: $(appName)
      containers: $(containerRegistry)/$(imageRepository):$(tag)

  # Build Worker image
  - task: Docker@2
    displayName: "Build Worker Docker image"
    inputs:
      command: build
      repository: "agentgaurd-worker"
      buildContext: $(Build.SourcesDirectory)
      dockerfile: '$(Build.SourcesDirectory)/worker/Dockerfile'
      containerRegistry: $(dockerRegistryServiceConnection)
      tags: |
        $(tag)
        latest

  # Push Worker image
  - task: Docker@2
    displayName: "Push Worker Docker image to ACR"
    inputs:
      command: push
      repository: "agentgaurd-worker"
      containerRegistry: $(dockerRegistryServiceConnection)
      tags: |
        $(tag)
        latest

  # Deploy Worker to App Service
  - task: AzureWebAppContainer@1
    displayName: "Deploy Worker container to App Service"
    inputs:
      azureSubscription: $(azureSubscription)
      appName: "agentguard-worker"
      containers: $(containerRegistry)/agentgaurd-worker:$(tag)