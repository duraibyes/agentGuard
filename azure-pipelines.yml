trigger:
  - main
  - main-post

variables:
  appName: "AgentGaurd"
  azureSubscription: "azure-rm-sc"
  containerRegistry: "reciperegistry.azurecr.io"
  imageRepository: "agentgaurd"
  dockerRegistryServiceConnection: "recipeRegistry-connection"
  tag: "$(Build.BuildId)"

pool:
  vmImage: "ubuntu-latest"

steps:
  - task: Docker@2
    displayName: "Build Docker image"
    inputs:
      command: build
      repository: $(imageRepository)
      buildContext: $(Build.SourcesDirectory)
      dockerfile: '$(Build.SourcesDirectory)/.container/Dockerfile'
      containerRegistry: $(dockerRegistryServiceConnection)
      tags: |
        $(tag)
        latest

  - task: Docker@2
    displayName: "Push Docker image to ACR"
    inputs:
      command: push
      repository: $(imageRepository)
      containerRegistry: $(dockerRegistryServiceConnection)
      tags: |
        $(tag)
        latest

  - task: AzureWebAppContainer@1
    displayName: "Deploy container to App Service"
    inputs:
      azureSubscription: $(azureSubscription)
      appName: $(appName)
      containers: $(containerRegistry)/$(imageRepository):$(tag)